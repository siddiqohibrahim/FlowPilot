<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | FlowPilot</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
        defer
    ></script>

    <script src="reset-password.js" defer></script>
</head>
<body>

    <main class="container py-5">
        <div class="mx-auto" style="max-width: 440px;">

            <h1 class="mb-2">Create a new password</h1>

            <p class="text-secondary mb-4">
                Choose a strong password for your FlowPilot account.
            </p>

            <form id="resetPasswordForm">

                <div class="mb-3">
                    <label for="newPassword" class="form-label">
                        New password
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="newPassword"
                        name="newPassword"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">
                        Confirm new password
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="confirmPassword"
                        name="confirmPassword"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <button
                    type="submit"
                    id="updatePasswordButton"
                    class="btn btn-primary w-100"
                >
                    Update Password
                </button>

                <p
                    id="resetPasswordFeedback"
                    class="mt-3"
                    aria-live="polite"
                ></p>

            </form>

            <p class="mt-3">
                <a href="login.html">Back to Login</a>
            </p>

        </div>
    </main>

</body>
</html>
