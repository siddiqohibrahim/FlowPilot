<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | FlowPilot</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="signup-page">

    <main class="signup-container">

        <!-- BRAND -->
        <a href="index.html" class="signup-brand">
            Flow<span>Pilot</span>
        </a>

        <!-- SIGNUP CARD -->
        <div class="signup-card">

            <div class="signup-heading">
                <h1>Create your account</h1>

                <p>
                    Start organizing your projects and bringing
                    your team's work together.
                </p>
            </div>

           <p id="selectedPlanMessage" class="text-center mb-3"></p>

                <form id="signupForm">

                <!-- FULL NAME -->
                <div class="mb-3">
                    <label for="signupName" class="form-label">
                        Full name
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="signupName"
                        name="name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >
                </div>

                <!-- EMAIL -->
                <div class="mb-3">
                    <label for="signupEmail" class="form-label">
                        Email address
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="signupEmail"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <!-- PASSWORD -->
                <div class="mb-3">
                    <label for="signupPassword" class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="signupPassword"
                        name="password"
                        placeholder="At least 8 characters"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <!-- CONFIRM PASSWORD -->
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">
                        Confirm password
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Enter your password again"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <!-- TERMS -->
                <div class="form-check mb-4">
                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="agreeTerms"
                        required
                    >

                    <label class="form-check-label" for="agreeTerms">
                        I agree to the terms and privacy policy.
                    </label>
                </div>

                <!-- SUBMIT -->
                <button
                    type="submit"
                    class="btn signup-submit w-100"
                >
                    Create Account
                </button>

                <!-- FEEDBACK -->
                <p
                    id="signupFeedback"
                    class="signup-feedback"
                    aria-live="polite"
                ></p>

            </form>

            <div class="signup-divider">
                <span>Already have an account?</span>
            </div>

            <a href="login.html" class="signup-login-link">
                Log in
            </a>

        </div>

        <p class="signup-footer">
            © 2026 FlowPilot. All rights reserved.
        </p>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
