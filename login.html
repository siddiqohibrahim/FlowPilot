<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Log In | FlowPilot</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="signup-page">

    <main class="signup-container">

        <!-- BRAND -->
        <a href="index.html" class="signup-brand">
            Flow<span>Pilot</span>
        </a>

        <!-- LOGIN CARD -->
        <div class="signup-card">

            <div class="signup-heading">
                <h1>Welcome back</h1>

                <p>
                    Log in to manage your projects and keep
                    your team's work moving forward.
                </p>
            </div>

            <form id="loginForm">

                <!-- EMAIL -->
                <div class="mb-3">
                    <label for="loginEmail" class="form-label">
                        Email address
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="loginEmail"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <!-- PASSWORD -->
                <div class="mb-3">
                    <label for="loginPassword" class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="loginPassword"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <!-- REMEMBER ME AND FORGOT PASSWORD -->
                <div class="d-flex justify-content-between align-items-center gap-2 mb-4">

                    <div class="form-check">
                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="rememberMe"
                        >

                        <label class="form-check-label" for="rememberMe">
                            Remember me
                        </label>
                    </div>

                    <a href="#" id="forgotPassword" class="signup-login-link">
                        Forgot password?
                    </a>

                </div>

                <!-- SUBMIT -->
                <button
                    type="submit"
                    class="btn signup-submit w-100"
                >
                    Log In
                </button>

                <!-- FEEDBACK -->
                <p
                    id="loginFeedback"
                    class="signup-feedback"
                    aria-live="polite"
                ></p>

            </form>

            <div class="signup-divider">
                <span>Don't have an account?</span>
            </div>

            <a href="signup.html" class="signup-login-link">
                Create an account
            </a>

        </div>

        <p class="signup-footer">
            © 2026 FlowPilot. All rights reserved.
        </p>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
